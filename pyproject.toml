[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abom"
version = "0.0.1"
description = "Agent bill of materials manager for skills, prompts, MCP servers, and packages."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://yanchao1999.github.io/abom/"
Repository = "https://github.com/YanChao1999/abom"
Issues = "https://github.com/YanChao1999/abom/issues"

[project.scripts]
abom = "abom.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
abom = ["recipes.json"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "mcp"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"mcp/server.py" = ["E402"]
"scripts/check_new_recipes.py" = ["E402"]
